<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Investment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Konfigurasi Tailwind untuk memaksakan mode terang (bisa diubah nanti)
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', background: '#f3f4f6' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-slate-800">
                <i class="fa-solid fa-wallet text-blue-400 mr-2"></i>FinDash
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block p-3 bg-blue-600 rounded-lg transition"><i class="fa-solid fa-chart-pie mr-3"></i>Global Overview</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-money-bill-transfer mr-3"></i>Cash Flow</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-chart-line mr-3"></i>Investments</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-store mr-3"></i>Business</a>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Global Overview</h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-blue-100 text-blue-800 px-4 py-2 rounded-full font-semibold">Net Worth: Rp 150.000.000</span>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-gray-500 text-sm font-medium">Pemasukan Bulan Ini</h3>
                    <p class="text-2xl font-bold text-green-600 mt-2">+ Rp 15.000.000</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-gray-500 text-sm font-medium">Pengeluaran Bulan Ini</h3>
                    <p class="text-2xl font-bold text-red-500 mt-2">- Rp 8.500.000</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-gray-500 text-sm font-medium">Profit Bisnis (Margin)</h3>
                    <p class="text-2xl font-bold text-blue-600 mt-2">35%</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4">Catat Transaksi Baru</h2>
                    <form id="transaction-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipe</label>
                            <select name="type" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="Income">Pemasukan</option>
                                <option value="Expense">Pengeluaran</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Kategori</label>
                            <input type="text" name="category" placeholder="Contoh: Gaji, Makanan, Crypto..." class="mt-1 w-full p-2 border border-gray-300 rounded-md" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Jumlah (Rp)</label>
                            <input type="number" name="amount" placeholder="50000" class="mt-1 w-full p-2 border border-gray-300 rounded-md" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Deskripsi</label>
                            <input type="text" name="description" placeholder="Makan siang..." class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                            Simpan ke Spreadsheet
                        </button>
                    </form>
                    <p id="success-msg" class="text-green-600 text-sm mt-3 hidden font-medium"><i class="fa-solid fa-check-circle mr-1"></i> Data berhasil disimpan!</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4">Alokasi Aset</h2>
                    <div class="relative h-64 w-full">
                        <canvas id="assetChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- 1. Inisialisasi Grafik Chart.js ---
        const ctx = document.getElementById('assetChart').getContext('2d');
        const assetChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Crypto (BTC, ETH)', 'Saham AS (AAPL)', 'Kas & Tabungan', 'Bisnis'],
                datasets: [{
                    data: [40, 25, 20, 15], // Data contoh sementara
                    backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // --- 2. Logika Mengirim Data ke Google Sheets ---
        // PENTING: Ganti URL di bawah dengan URL Aplikasi Web dari Apps Script Anda!
        const scriptURL = 'MASUKKAN_URL_APPS_SCRIPT_ANDA_DISINI'; 
        const form = document.getElementById('transaction-form');
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('success-msg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.innerHTML = 'Menyimpan... <i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    msg.classList.remove('hidden'); // Tampilkan pesan sukses
                    form.reset(); // Kosongkan form
                    btn.innerHTML = 'Simpan ke Spreadsheet';
                    btn.disabled = false;
                    setTimeout(() => msg.classList.add('hidden'), 3000); // Sembunyikan pesan setelah 3 detik
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Gagal menyimpan data. Pastikan URL Apps Script benar.');
                    btn.innerHTML = 'Simpan ke Spreadsheet';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
