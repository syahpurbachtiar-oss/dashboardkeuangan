<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Investment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-slate-800">
                <i class="fa-solid fa-wallet text-blue-400 mr-2"></i>FinDash
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block p-3 bg-blue-600 rounded-lg transition"><i class="fa-solid fa-chart-pie mr-3"></i>Global Overview</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-money-bill-transfer mr-3"></i>Cash Flow</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Global Overview</h1>
                <div class="flex items-center space-x-4">
                    <!-- ID ditambahkan di sini agar bisa diubah via Javascript -->
                    <span id="net-worth-display" class="bg-blue-100 text-blue-800 px-4 py-2 rounded-full font-semibold">Net Worth: Menghitung...</span>
                </div>
            </header>

            <!-- Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-gray-500 text-sm font-medium">Total Pemasukan</h3>
                    <!-- ID ditambahkan di sini -->
                    <p id="income-display" class="text-2xl font-bold text-green-600 mt-2">Rp 0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-gray-500 text-sm font-medium">Total Pengeluaran</h3>
                    <!-- ID ditambahkan di sini -->
                    <p id="expense-display" class="text-2xl font-bold text-red-500 mt-2">Rp 0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Form Input Data -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4">Catat Transaksi Baru</h2>
                    <form id="transaction-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipe</label>
                            <select name="type" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="Income">Pemasukan</option>
                                <option value="Expense">Pengeluaran</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Kategori</label>
                            <input type="text" name="category" placeholder="Contoh: Gaji, Makanan..." class="mt-1 w-full p-2 border border-gray-300 rounded-md" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Jumlah (Rp)</label>
                            <input type="number" name="amount" placeholder="50000" class="mt-1 w-full p-2 border border-gray-300 rounded-md" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Deskripsi</label>
                            <input type="text" name="description" placeholder="Keterangan..." class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                            Simpan ke Spreadsheet
                        </button>
                    </form>
                    <p id="success-msg" class="text-green-600 text-sm mt-3 hidden font-medium"><i class="fa-solid fa-check-circle mr-1"></i> Data berhasil disimpan!</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Logika JavaScript -->
    <script>
        // PENTING: Ganti URL di bawah dengan URL Aplikasi Web dari Apps Script Anda!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyz2GVcj7zpDwsYuGvF-quo2tRJIMNTTrqRoZv_F5nk6IIDJV15RUfhJ7VNfgrksLYfiA/exec'; 
        
        // Mengambil elemen HTML
        const form = document.getElementById('transaction-form');
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('success-msg');
        
        const incomeDisplay = document.getElementById('income-display');
        const expenseDisplay = document.getElementById('expense-display');
        const netWorthDisplay = document.getElementById('net-worth-display');

        // --- FUNGSI MENGAMBIL DAN MENGHITUNG DATA ---
        async function fetchAndUpdateData() {
            try {
                // Mengambil data (GET) dari Google Sheets
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                let totalIncome = 0;
                let totalExpense = 0;

                // Mengulangi setiap baris data
                data.forEach(item => {
                    // Pastikan mengubah teks menjadi angka menggunakan parseFloat
                    const amount = parseFloat(item.amount) || 0; 
                    
                    if (item.type === 'Income') {
                        totalIncome += amount;
                    } else if (item.type === 'Expense') {
                        totalExpense += amount;
                    }
                });

                const netWorth = totalIncome - totalExpense;

                // Menempelkan angka ke layar HTML
                // (Gunakan toLocaleString('id-ID') agar format angkanya jadi gaya Indonesia contoh: 10.000)
                incomeDisplay.innerText = '+ Rp ' + totalIncome.toLocaleString('id-ID');
                expenseDisplay.innerText = '- Rp ' + totalExpense.toLocaleString('id-ID');
                netWorthDisplay.innerText = 'Net Worth: Rp ' + netWorth.toLocaleString('id-ID');

            } catch (error) {
                console.error("Gagal memuat data:", error);
                netWorthDisplay.innerText = 'Gagal memuat data';
            }
        }

        // --- FUNGSI MENGIRIM DATA ---
        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.innerHTML = 'Menyimpan... <i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            // Mengirim data (POST) ke Google Sheets
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    msg.classList.remove('hidden'); 
                    form.reset(); 
                    btn.innerHTML = 'Simpan ke Spreadsheet';
                    btn.disabled = false;
                    setTimeout(() => msg.classList.add('hidden'), 3000); 
                    
                    // SETELAH DATA BERHASIL DISIMPAN, PANGGIL FUNGSI UPDATE AGAR ANGKA DI LAYAR BERUBAH
                    fetchAndUpdateData();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Gagal menyimpan data.');
                    btn.innerHTML = 'Simpan ke Spreadsheet';
                    btn.disabled = false;
                });
        });

        // Panggil fungsi ini pertama kali saat halaman web baru saja dibuka
        fetchAndUpdateData();
    </script>
</body>
</html>
